name: Component Validation

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'components/**/*.md'
      - 'src/validator/**'
      - 'src/components/**'
      - '.github/workflows/component_validation.yaml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'components/**/*.md'
      - 'src/validator/**'
      - 'src/components/**'
      - '.github/workflows/component_validation.yaml'

jobs:
  validate-components:
    name: Validate Component Structure and Size
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build validator
        run: cargo build --release --bin xzagentz

      - name: Validate component frontmatter
        run: |
          echo "Validating YAML frontmatter in components..."
          EXIT_CODE=0

          for file in components/**/*.md; do
            if [ -f "$file" ]; then
              echo "Checking $file..."

              # Check for frontmatter delimiters
              if ! head -1 "$file" | grep -q "^---$"; then
                echo "ERROR: $file missing frontmatter opening delimiter"
                EXIT_CODE=1
              fi

              # Check for closing delimiter
              if ! head -20 "$file" | tail -n +2 | grep -q "^---$"; then
                echo "ERROR: $file missing frontmatter closing delimiter"
                EXIT_CODE=1
              fi

              # Check for required component fields
              if ! grep -q "^  name:" "$file"; then
                echo "ERROR: $file missing component name"
                EXIT_CODE=1
              fi

              if ! grep -q "^  category:" "$file"; then
                echo "ERROR: $file missing component category"
                EXIT_CODE=1
              fi

              if ! grep -q "^  version:" "$file"; then
                echo "ERROR: $file missing component version"
                EXIT_CODE=1
              fi
            fi
          done

          if [ $EXIT_CODE -eq 0 ]; then
            echo "All components have valid frontmatter"
          fi

          exit $EXIT_CODE

      - name: Validate language markers
        run: |
          echo "Validating language section markers..."
          EXIT_CODE=0

          for file in components/**/*.md; do
            if [ -f "$file" ]; then
              # Check for unclosed language sections
              OPEN_COUNT=$(grep -c "^<!-- LANG:" "$file" || true)
              CLOSE_COUNT=$(grep -c "^<!-- /LANG -->" "$file" || true)

              if [ $OPEN_COUNT -ne $CLOSE_COUNT ]; then
                echo "ERROR: $file has mismatched language markers (open: $OPEN_COUNT, close: $CLOSE_COUNT)"
                EXIT_CODE=1
              fi

              # Check for invalid marker format
              if grep -n "^<!-- LANG:[^ ]" "$file" | grep -v "^<!-- LANG:[a-z]*-->$"; then
                echo "ERROR: $file has invalid language marker format"
                EXIT_CODE=1
              fi
            fi
          done

          if [ $EXIT_CODE -eq 0 ]; then
            echo "All language markers are valid"
          fi

          exit $EXIT_CODE

      - name: Validate component sizes
        run: |
          echo "Validating component sizes..."
          EXIT_CODE=0

          # Size limits
          CORE_MAX=500
          GENERAL_MAX=800
          LANGUAGE_MAX=600
          TOOL_ESSENTIAL_MAX=300
          TOOL_COMPREHENSIVE_MAX=800

          for file in components/**/*.md; do
            if [ -f "$file" ]; then
              LINE_COUNT=$(grep -c '[^[:space:]]' "$file" || true)
              CATEGORY=$(grep "^  category:" "$file" | awk '{print $2}')
              TIER=$(grep "^  tier:" "$file" | awk '{print $2}' || echo "")
              NAME=$(basename "$file" .md)

              LIMIT=0
              case "$CATEGORY" in
                core)
                  LIMIT=$CORE_MAX
                  ;;
                general)
                  LIMIT=$GENERAL_MAX
                  ;;
                languages)
                  LIMIT=$LANGUAGE_MAX
                  ;;
                tools)
                  if [ "$TIER" = "essential" ]; then
                    LIMIT=$TOOL_ESSENTIAL_MAX
                  else
                    LIMIT=$TOOL_COMPREHENSIVE_MAX
                  fi
                  ;;
              esac

              if [ $LIMIT -gt 0 ] && [ $LINE_COUNT -gt $LIMIT ]; then
                echo "ERROR: $file exceeds size limit: $LINE_COUNT > $LIMIT lines (category: $CATEGORY, tier: $TIER)"
                EXIT_CODE=1
              else
                WARN_THRESHOLD=$((LIMIT * 80 / 100))
                if [ $LIMIT -gt 0 ] && [ $LINE_COUNT -gt $WARN_THRESHOLD ]; then
                  echo "WARNING: $file approaching size limit: $LINE_COUNT / $LIMIT lines (${CATEGORY}${TIER:+/$TIER})"
                else
                  echo "OK: $file within size limit: $LINE_COUNT / $LIMIT lines (${CATEGORY}${TIER:+/$TIER})"
                fi
              fi
            fi
          done

          if [ $EXIT_CODE -eq 0 ]; then
            echo ""
            echo "All components meet size requirements"
          else
            echo ""
            echo "Some components exceed size limits"
          fi

          exit $EXIT_CODE

      - name: Run validator unit tests
        run: cargo test --all-features validator::size -- --nocapture

      - name: Run component integration tests
        run: cargo test --all-features -- --nocapture

      - name: Generate size report
        if: always()
        run: |
          echo "# Component Size Report" > size_report.md
          echo "" >> size_report.md
          echo "Generated on: $(date -u)" >> size_report.md
          echo "" >> size_report.md
          echo "## Size Summary" >> size_report.md
          echo "" >> size_report.md
          echo "| Component | Category | Tier | Lines | Limit | Usage |" >> size_report.md
          echo "|-----------|----------|------|-------|-------|-------|" >> size_report.md

          for file in components/**/*.md; do
            if [ -f "$file" ]; then
              LINE_COUNT=$(grep -c '[^[:space:]]' "$file" || true)
              CATEGORY=$(grep "^  category:" "$file" | awk '{print $2}')
              TIER=$(grep "^  tier:" "$file" | awk '{print $2}' || echo "-")
              NAME=$(basename "$file" .md)

              LIMIT=0
              case "$CATEGORY" in
                core) LIMIT=500 ;;
                general) LIMIT=800 ;;
                languages) LIMIT=600 ;;
                tools)
                  if [ "$TIER" = "essential" ]; then
                    LIMIT=300
                  else
                    LIMIT=800
                  fi
                  ;;
              esac

              USAGE=$((LINE_COUNT * 100 / LIMIT))
              echo "| $NAME | $CATEGORY | $TIER | $LINE_COUNT | $LIMIT | ${USAGE}% |" >> size_report.md
            fi
          done

          echo "" >> size_report.md
          echo "## Status" >> size_report.md
          echo "" >> size_report.md
          echo "Validation completed at $(date -u)" >> size_report.md

          cat size_report.md

      - name: Upload size report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: component-size-report
          path: size_report.md
          retention-days: 30

  check-documentation:
    name: Check Component Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify documentation completeness
        run: |
          echo "Checking for documentation..."
          EXIT_CODE=0

          # Check that each component category has documentation
          for category in core general languages tools; do
            if [ ! -d "components/$category" ]; then
              echo "WARNING: No components directory for category: $category"
            fi
          done

          # Check for explanation docs
          if [ ! -d "docs/explanations" ]; then
            echo "ERROR: Missing docs/explanations directory"
            EXIT_CODE=1
          fi

          # Verify phase documentation exists
          for phase in phase_4_tool_component_tiering_implementation.md; do
            if [ ! -f "docs/explanations/$phase" ]; then
              echo "WARNING: Missing documentation: docs/explanations/$phase"
            fi
          done

          exit $EXIT_CODE
