info:
  name: microservices
  pattern: Microservices
  description: Cloud-native microservices architecture with independent services
  use_cases:
  - Scalable web applications
  - Distributed systems
  - Multi-team development
structure:
  layers:
  - API Gateway
  - Service Layer
  - Data Layer
  integration_patterns:
  - REST APIs
  - Message Queue
  - Event Bus
  required_components:
  - api-gateway
  - service-discovery
  - message-broker
default_components:
- name: API Gateway
  layer: API Gateway
  role: Entry point for all client requests, handles routing and authentication
  typical_technologies:
  - Kong
  - Nginx
  - Traefik
- name: Service Discovery
  layer: Service Layer
  role: Dynamic service registration and discovery
  typical_technologies:
  - Consul
  - Eureka
  - etcd
- name: Message Broker
  layer: Service Layer
  role: Asynchronous communication between services
  typical_technologies:
  - RabbitMQ
  - Kafka
  - Redis
customization_points:
- Add specific microservices based on business domains
- Configure service mesh for advanced networking
- Add monitoring and tracing components
