info:
  name: monolithic
  pattern: Monolithic
  description: Traditional single-deployment monolithic architecture
  use_cases:
  - Small to medium applications
  - Rapid prototyping
  - Simple deployment requirements
structure:
  layers:
  - Presentation Layer
  - Business Logic Layer
  - Data Access Layer
  integration_patterns:
  - Direct method calls
  required_components:
  - web-server
  - application
  - database
default_components:
- name: Web Server
  layer: Presentation Layer
  role: Handles HTTP requests and serves web pages
  typical_technologies:
  - Nginx
  - Apache
  - IIS
- name: Application
  layer: Business Logic Layer
  role: Core application logic and business rules
  typical_technologies:
  - Spring Boot
  - Django
  - Rails
- name: Database
  layer: Data Access Layer
  role: Persistent data storage
  typical_technologies:
  - PostgreSQL
  - MySQL
  - SQLite
customization_points:
- Add caching layer for performance
- Implement background job processing
- Add file storage integration
