info:
  name: layered
  pattern: Layered
  description: Traditional layered architecture with clear separation of concerns
  use_cases:
  - Enterprise applications
  - Well-structured codebases
  - Team-based development
structure:
  layers:
  - Presentation Layer
  - Application Layer
  - Domain Layer
  - Infrastructure Layer
  integration_patterns:
  - Layer-to-layer calls
  required_components:
  - ui
  - application-services
  - domain-model
  - data-access
default_components:
- name: User Interface
  layer: Presentation Layer
  role: User interaction and display
  typical_technologies:
  - React
  - Angular
  - Vue.js
- name: Application Services
  layer: Application Layer
  role: Orchestrates business workflows
  typical_technologies:
  - REST APIs
  - GraphQL
  - gRPC
- name: Domain Model
  layer: Domain Layer
  role: Core business logic and entities
  typical_technologies:
  - Domain Models
  - Business Rules
- name: Data Access
  layer: Infrastructure Layer
  role: Database operations and persistence
  typical_technologies:
  - ORM
  - Repository Pattern
  - SQL
customization_points:
- Add authentication and authorization layer
- Implement caching strategy
- Add logging and monitoring
